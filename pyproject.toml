[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "phosphokin"
version = "0.1.0"
description = "Cross-species phosphosite mapping and kinase-motif enrichment with the human Ser/Thr kinome atlas"
readme = "README.md"
authors = [{ name = "Li Li" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scipy>=1.9",
    "matplotlib>=3.6",
    "openpyxl>=3.0",
]

[project.optional-dependencies]
gprofiler = ["gprofiler-official>=1.0"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
